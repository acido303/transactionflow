version: "3.9"

services:

  # ─── Kafka (KRaft mode, no ZooKeeper) ───────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: transactionflow-kafka
    hostname: kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=${KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE}
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID}
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - transactionflow-net

  kafka-init:
    image: bitnami/kafka:3.7
    container_name: transactionflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC_RAW} --partitions 3 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC_VALIDATED} --partitions 3 --replication-factor 1 &&
        kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC_REJECTED} --partitions 3 --replication-factor 1 &&
        echo 'Kafka topics created successfully'
      "
    networks:
      - transactionflow-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: transactionflow-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=${KAFKA_UI_CLUSTER_NAME}
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - transactionflow-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: transactionflow-postgres
    hostname: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - transactionflow-net

  adminer:
    image: adminer:latest
    container_name: transactionflow-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transactionflow-net

  # ─── HDFS ────────────────────────────────────────────────────────────────────
  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: transactionflow-hdfs-namenode
    hostname: hdfs-namenode
    ports:
      - "${HDFS_NAMENODE_HTTP_PORT}:9870"
      - "${HDFS_NAMENODE_RPC_PORT}:9000"
    environment:
      - CLUSTER_NAME=${HDFS_CLUSTER_NAME}
      - CORE_CONF_fs_defaultFS=${HDFS_DEFAULT_FS}
      - HDFS_CONF_dfs_replication=${HDFS_REPLICATION}
      - HDFS_CONF_dfs_permissions_enabled=${HDFS_PERMISSIONS_ENABLED}
      - HDFS_CONF_dfs_namenode_name_dir=file:///hadoop/dfs/name
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - transactionflow-net

  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: transactionflow-hdfs-datanode
    hostname: hdfs-datanode
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    environment:
      - CORE_CONF_fs_defaultFS=${HDFS_DEFAULT_FS}
      - HDFS_CONF_dfs_replication=${HDFS_REPLICATION}
      - HDFS_CONF_dfs_permissions_enabled=${HDFS_PERMISSIONS_ENABLED}
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    networks:
      - transactionflow-net

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: transactionflow-hdfs-init
    depends_on:
      hdfs-namenode:
        condition: service_healthy
      hdfs-datanode:
        condition: service_started
    command: >
      bash -c "
        sleep 10 &&
        hdfs dfs -mkdir -p /data/transactionflow/raw/transactions &&
        hdfs dfs -mkdir -p /data/transactionflow/rejected/transactions &&
        hdfs dfs -mkdir -p /data/transactionflow/processed/transactions &&
        hdfs dfs -mkdir -p /data/transactionflow/checkpoints &&
        hdfs dfs -chmod -R 777 /data &&
        echo 'HDFS directories created successfully'
      "
    environment:
      - CORE_CONF_fs_defaultFS=${HDFS_DEFAULT_FS}
    networks:
      - transactionflow-net

  # ─── Spark ───────────────────────────────────────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5
    container_name: transactionflow-spark-master
    hostname: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_RPC_PORT}:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    networks:
      - transactionflow-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: transactionflow-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=${SPARK_MASTER_URL}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    networks:
      - transactionflow-net

  spark-streaming-job:
    build:
      context: ./spark-jobs
      dockerfile: Dockerfile
    container_name: transactionflow-spark-streaming-job
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-namenode:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    environment:
      - SPARK_MASTER_URL=${SPARK_MASTER_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC_RAW=${KAFKA_TOPIC_RAW}
      - HDFS_RAW_PATH=${HDFS_RAW_PATH}
      - HDFS_REJECTED_PATH=${HDFS_REJECTED_PATH}
      - HDFS_CHECKPOINT_PATH=${HDFS_CHECKPOINT_PATH}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - HIGH_VALUE_THRESHOLD=${HIGH_VALUE_THRESHOLD}
    networks:
      - transactionflow-net

  # ─── Application Services ────────────────────────────────────────────────────
  producer-service:
    build:
      context: ./producer-service
      dockerfile: Dockerfile
    container_name: transactionflow-producer-service
    hostname: producer-service
    ports:
      - "${PRODUCER_PORT}:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - TRANSACTIONFLOW_TOPIC_RAW=${KAFKA_TOPIC_RAW}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - transactionflow-net

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: transactionflow-reporting-service
    hostname: reporting-service
    ports:
      - "${REPORTING_PORT}:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - PRODUCER_SERVICE_URL=${PRODUCER_SERVICE_URL}
      - HDFS_NAMENODE_URL=${HDFS_NAMENODE_HTTP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transactionflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transactionflow-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NEXT_PUBLIC_REPORTING_API_URL=${NEXT_PUBLIC_REPORTING_API_URL}
      - REPORTING_API_URL=${REPORTING_API_INTERNAL_URL}
    depends_on:
      - reporting-service
    networks:
      - transactionflow-net

volumes:
  kafka-data:
  postgres-data:
  hdfs-namenode-data:
  hdfs-datanode-data:

networks:
  transactionflow-net:
    driver: bridge
