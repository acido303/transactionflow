services:

  # ─── Kafka (KRaft mode, no ZooKeeper) ───────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.1
    container_name: transactionflow-kafka
    hostname: kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=${KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE}
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - transactionflow-net

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: transactionflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC_RAW} --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC_VALIDATED} --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC_REJECTED} --partitions 3 --replication-factor 1 &&
        echo 'Kafka topics created successfully'
      "
    networks:
      - transactionflow-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: transactionflow-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=${KAFKA_UI_CLUSTER_NAME}
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - transactionflow-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: transactionflow-postgres
    hostname: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - transactionflow-net

  adminer:
    image: adminer:latest
    container_name: transactionflow-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transactionflow-net

  # ─── HDFS ────────────────────────────────────────────────────────────────────
  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: transactionflow-hdfs-namenode
    hostname: hdfs-namenode
    # extra_hosts ensures the container can resolve its own hostname before Java starts,
    # preventing AuthenticationFilterInitializer from failing on InetAddress.getLocalHost()
    extra_hosts:
      - "hdfs-namenode:127.0.0.1"
    ports:
      - "${HDFS_NAMENODE_HTTP_PORT}:9870"
      - "${HDFS_NAMENODE_RPC_PORT}:9000"
    environment:
      - CLUSTER_NAME=${HDFS_CLUSTER_NAME}
      - CORE_CONF_fs_defaultFS=${HDFS_DEFAULT_FS}
      - HDFS_CONF_dfs_replication=${HDFS_REPLICATION}
      - HDFS_CONF_dfs_permissions_enabled=${HDFS_PERMISSIONS_ENABLED}
      - HDFS_CONF_dfs_namenode_name_dir=file:///hadoop/dfs/name
      - CORE_CONF_hadoop_security_authentication=simple
      - CORE_CONF_hadoop_security_authorization=false
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get 2>&1 | grep -q 'Safe mode is OFF'"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 60s
    networks:
      - transactionflow-net

  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: transactionflow-hdfs-datanode
    hostname: hdfs-datanode
    depends_on:
      hdfs-namenode:
        condition: service_started
    environment:
      - CORE_CONF_fs_defaultFS=${HDFS_DEFAULT_FS}
      - HDFS_CONF_dfs_replication=${HDFS_REPLICATION}
      - HDFS_CONF_dfs_permissions_enabled=${HDFS_PERMISSIONS_ENABLED}
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    networks:
      - transactionflow-net

  hdfs-init:
    image: curlimages/curl:latest
    container_name: transactionflow-hdfs-init
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        BASE="http://hdfs-namenode:9870/webhdfs/v1"
        for DIR in \
          "/data/transactionflow/raw/transactions" \
          "/data/transactionflow/rejected/transactions" \
          "/data/transactionflow/processed/transactions" \
          "/data/transactionflow/checkpoints"; do
          echo "Creating HDFS dir: $$DIR"
          response=$$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT "$$BASE$$DIR?op=MKDIRS&user.name=hdfs")
          body=$$(echo "$$response" | head -1)
          status=$$(echo "$$response" | grep 'HTTP_STATUS' | cut -d: -f2)
          echo "  Response: $$body  (HTTP $$status)"
          if [ "$$status" != "200" ]; then
            echo "ERROR: MKDIRS failed for $$DIR with HTTP $$status"
            exit 1
          fi
        done
        echo "All HDFS directories created successfully"
    networks:
      - transactionflow-net

  # ─── Spark ───────────────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.1
    container_name: transactionflow-spark-master
    hostname: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_RPC_PORT}:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - transactionflow-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: transactionflow-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker ${SPARK_MASTER_URL}
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
    networks:
      - transactionflow-net

  spark-streaming-job:
    build:
      context: ./spark-jobs
      dockerfile: Dockerfile
    container_name: transactionflow-spark-streaming-job
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-namenode:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    environment:
      - SPARK_MASTER_URL=${SPARK_MASTER_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC_RAW=${KAFKA_TOPIC_RAW}
      - HDFS_RAW_PATH=${HDFS_RAW_PATH}
      - HDFS_REJECTED_PATH=${HDFS_REJECTED_PATH}
      - HDFS_CHECKPOINT_PATH=${HDFS_CHECKPOINT_PATH}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - HIGH_VALUE_THRESHOLD=${HIGH_VALUE_THRESHOLD}
    networks:
      - transactionflow-net

  # ─── Application Services ────────────────────────────────────────────────────
  producer-service:
    build:
      context: ./producer-service
      dockerfile: Dockerfile
    container_name: transactionflow-producer-service
    hostname: producer-service
    ports:
      - "${PRODUCER_PORT}:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - TRANSACTIONFLOW_TOPIC_RAW=${KAFKA_TOPIC_RAW}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - transactionflow-net

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    container_name: transactionflow-reporting-service
    hostname: reporting-service
    ports:
      - "${REPORTING_PORT}:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - PRODUCER_SERVICE_URL=${PRODUCER_SERVICE_URL}
      - HDFS_NAMENODE_URL=${HDFS_NAMENODE_HTTP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transactionflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transactionflow-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NEXT_PUBLIC_REPORTING_API_URL=${NEXT_PUBLIC_REPORTING_API_URL}
      - REPORTING_API_URL=${REPORTING_API_INTERNAL_URL}
    depends_on:
      - reporting-service
    networks:
      - transactionflow-net

volumes:
  kafka-data:
  postgres-data:
  hdfs-namenode-data:
  hdfs-datanode-data:

networks:
  transactionflow-net:
    driver: bridge
